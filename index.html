
<!DOCTYPE html>

<head>

<style>

header {
  padding: 25px;
  border-bottom: 1px solid #333;

  font-weight: bold;

  max-width: 650px;

}

  color: #aaa;
  letter-spacing: 3px;
  font-size: 12px;

button {

  border-radius: 7px;
